<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gann Level Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --card: #111827;
    --border: #1e293b;
    --gold: #f59e0b;
    --gold2: #fbbf24;
    --green: #10b981;
    --red: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh; padding: 20px;
    background-image: 
      radial-gradient(ellipse at 20% 50%, rgba(245,158,11,0.05) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(59,130,246,0.05) 0%, transparent 50%);
  }
  .container { max-width: 720px; margin: 0 auto; }

  header {
    text-align: center; padding: 30px 0 20px;
    border-bottom: 1px solid var(--border); margin-bottom: 30px; position: relative;
  }
  header::after {
    content: ''; position: absolute; bottom: -1px; left: 50%;
    transform: translateX(-50%); width: 80px; height: 2px; background: var(--gold);
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 4px;
    background: linear-gradient(135deg, var(--gold), var(--gold2), #fff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .subtitle { color: var(--muted); font-size: 0.85rem; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }

  .input-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-bottom: 24px; }

  .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .input-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px; }

  .input-group { display: flex; flex-direction: column; gap: 8px; }
  .input-group label { font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .input-group input, .input-group select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 12px 16px; border-radius: 8px; font-family: 'Rajdhani', sans-serif;
    font-size: 1.05rem; font-weight: 600; outline: none; transition: border-color 0.2s;
  }
  .input-group input:focus, .input-group select:focus { border-color: var(--gold); }
  .input-group select option { background: var(--card); }

  .hint { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
  .hint span { color: var(--gold); font-weight: 700; }

  .rounded-display {
    background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2);
    border-radius: 8px; padding: 10px 16px; font-size: 0.85rem; color: var(--muted);
    display: none; margin-bottom: 16px;
  }
  .rounded-display.show { display: block; }
  .rounded-display strong { color: var(--gold); font-size: 1rem; }

  .calc-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--gold), #d97706);
    border: none; border-radius: 8px; color: #000;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 3px;
    cursor: pointer; transition: all 0.2s;
  }
  .calc-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(245,158,11,0.3); }

  .results { display: none; }
  .results.show { display: block; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  .section-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; font-size: 1rem; margin-bottom: 10px; padding-left: 4px; }
  .section-title.res { color: var(--red); }
  .section-title.sup { color: var(--green); }
  .section-title.base { color: var(--gold); }

  .levels-grid { display: grid; gap: 8px; margin-bottom: 16px; }

  .level-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 18px; display: flex; justify-content: space-between; align-items: center;
    transition: all 0.2s; position: relative; overflow: hidden;
  }
  .level-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .level-card.resistance::before { background: var(--red); }
  .level-card.support::before { background: var(--green); }
  .level-card.base::before { background: var(--gold); }
  .level-card:hover { border-color: #334155; transform: translateX(3px); }

  .level-left { display: flex; align-items: center; gap: 12px; }
  .level-badge { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 5px; letter-spacing: 1px; min-width: 38px; text-align: center; }
  .resistance .level-badge { background: rgba(239,68,68,0.15); color: var(--red); }
  .support .level-badge { background: rgba(16,185,129,0.15); color: var(--green); }
  .base .level-badge { background: rgba(245,158,11,0.15); color: var(--gold); }

  .level-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.3; }
  .level-desc small { display: block; font-size: 0.68rem; color: #2d3f55; letter-spacing: 1px; }

  .level-right { display: flex; align-items: center; gap: 10px; }
  .level-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 1px; }
  .resistance .level-value { color: var(--red); }
  .support .level-value { color: var(--green); }
  .base .level-value { color: var(--gold); }

  .change-pct { font-size: 0.72rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; min-width: 52px; text-align: center; }
  .resistance .change-pct { background: rgba(239,68,68,0.1); color: var(--red); }
  .support .change-pct { background: rgba(16,185,129,0.1); color: var(--green); }
  .base .change-pct { background: rgba(245,158,11,0.1); color: var(--gold); }

  .note { background: rgba(245,158,11,0.05); border: 1px solid rgba(245,158,11,0.15); border-radius: 8px; padding: 14px 18px; font-size: 0.85rem; color: var(--muted); line-height: 1.8; margin-top: 8px; }
  .note strong { color: var(--gold); }

  @media (max-width: 520px) {
    .input-row, .input-row-3 { grid-template-columns: 1fr; }
    .logo { font-size: 1.8rem; }
    .change-pct { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">GANN LEVEL CALCULATOR</div>
    <div class="subtitle">Square of 9 · Gann Hidden Method · Verified ✅</div>
  </header>

  <div class="input-section">
    <div class="input-row">
      <div class="input-group">
        <label>Instrument</label>
        <select id="instrument">
          <option value="Nifty 50">Nifty 50</option>
          <option value="Bank Nifty">Bank Nifty</option>
          <option value="Midcap Nifty">Midcap Nifty</option>
          <option value="Finnifty">Finnifty</option>
          <option value="Sensex">Sensex</option>
        </select>
      </div>
      <div class="input-group">
        <label>Yesterday Low</label>
        <input type="number" id="prev_low" placeholder="e.g. 25327.6" oninput="showRounded()" />
        <div class="hint">Auto-rounds to nearest 10 → <span id="rounded-hint">—</span></div>
      </div>
    </div>

    <div class="rounded-display" id="rounded-display">
      📐 Gann Base Price: <strong id="rounded-value">—</strong> &nbsp;(nearest 10 rounded)
    </div>

    <button class="calc-btn" onclick="calculate()">⚡ CALCULATE LEVELS</button>
  </div>

  <div class="results" id="results">
    <div class="section-title res">▲ RESISTANCE LEVELS</div>
    <div class="levels-grid" id="resistance-levels"></div>

    <div class="section-title base">● BASE (Rounded Yesterday Low)</div>
    <div class="levels-grid" id="base-level"></div>

    <div class="section-title sup">▼ SUPPORT LEVELS</div>
    <div class="levels-grid" id="support-levels"></div>

    <div class="note" id="note-text"></div>
  </div>
</div>

<script>
/*
  GANN HIDDEN METHOD — VERIFIED ✅
  
  Step 1: Take Yesterday's Low
  Step 2: Round to nearest 10
  Step 3: Apply Gann Square of 9
  
  Steps used:
    R1/S1 = ±0.125
    R2/S2 = ±0.25
    R3/S3 = ±0.75
    R4/S4 = ±1.00

  VERIFIED:
    Yesterday Low: 25327.6 → rounded: 25330
    R1 = 25370 ✅ (Gann Hidden: 25370)
    R3 = 25569 ≈ 25570 ✅ (Gann Hidden: 25570)
    R4 = 25649 ≈ 25650 ✅ (Gann Hidden: 25650)
    S2 = 25250 (downside area)
    S1 = 25290 → 25330 area ✅
*/

function roundNearest10(n) {
  return Math.round(n / 10) * 10;
}

function calcLevels(base) {
  const s = Math.sqrt(base);
  return {
    R4: Math.round((s + 1.00) ** 2),
    R3: Math.round((s + 0.75) ** 2),
    R2: Math.round((s + 0.25) ** 2),
    R1: Math.round((s + 0.125) ** 2),
    BASE: base,
    S1: Math.round((s - 0.125) ** 2),
    S2: Math.round((s - 0.25) ** 2),
    S3: Math.round((s - 0.75) ** 2),
    S4: Math.round((s - 1.00) ** 2),
  };
}

function pct(a, b) {
  const d = ((a - b) / b * 100);
  return (d >= 0 ? '+' : '') + d.toFixed(2) + '%';
}

function fmt(n) { return n.toLocaleString('en-IN'); }

function card(type, badge, desc, sub, value, base) {
  return `<div class="level-card ${type}">
    <div class="level-left">
      <span class="level-badge">${badge}</span>
      <div class="level-desc">${desc}<small>${sub}</small></div>
    </div>
    <div class="level-right">
      <span class="change-pct">${pct(value, base)}</span>
      <span class="level-value">${fmt(value)}</span>
    </div>
  </div>`;
}

function showRounded() {
  const val = parseFloat(document.getElementById('prev_low').value);
  if (!val || val <= 0) {
    document.getElementById('rounded-hint').textContent = '—';
    document.getElementById('rounded-display').classList.remove('show');
    return;
  }
  const r = roundNearest10(val);
  document.getElementById('rounded-hint').textContent = r.toLocaleString('en-IN');
  document.getElementById('rounded-value').textContent = r.toLocaleString('en-IN');
  document.getElementById('rounded-display').classList.add('show');
}

function calculate() {
  const raw = parseFloat(document.getElementById('prev_low').value);
  const instrument = document.getElementById('instrument').value;

  if (!raw || raw <= 0) { alert('Yesterday Low enter karein'); return; }

  const base = roundNearest10(raw);
  const L = calcLevels(base);

  document.getElementById('resistance-levels').innerHTML =
    card('resistance','R4','Strong Resistance','Book profit / Major target',L.R4,base) +
    card('resistance','R3','Resistance','Watch for reversal',L.R3,base) +
    card('resistance','R2','Resistance','Minor hurdle',L.R2,base) +
    card('resistance','R1','Nearest Resistance','First barrier ▲',L.R1,base);

  document.getElementById('base-level').innerHTML =
    card('base','BASE',`Yesterday Low ${fmt(raw)} → Rounded`,'Gann anchor point',L.BASE,base);

  document.getElementById('support-levels').innerHTML =
    card('support','S1','Nearest Support','First cushion ▼',L.S1,base) +
    card('support','S2','Support','Minor support',L.S2,base) +
    card('support','S3','Support','Watch for bounce',L.S3,base) +
    card('support','S4','Strong Support','Buy zone / Stop loss area',L.S4,base);

  document.getElementById('note-text').innerHTML = `
    <strong>📌 ${instrument} — Aaj ke Gann Levels</strong><br>
    Yesterday Low: <strong>${fmt(raw)}</strong> → Rounded Base: <strong style="color:var(--gold)">${fmt(base)}</strong><br>
    <strong>Bullish:</strong> Above <strong style="color:var(--green)">${fmt(L.R1)}</strong> → target ${fmt(L.R3)} → ${fmt(L.R4)}<br>
    <strong>Bearish:</strong> Below <strong style="color:var(--red)">${fmt(L.S1)}</strong> → target ${fmt(L.S2)} → ${fmt(L.S3)}<br>
    <span style="font-size:0.75rem;color:#334155">
      Method: Yesterday Low → Round nearest 10 → √price ±0.125/0.25/0.75/1.00 | Verified with @Gannhidden ✅
    </span>
  `;

  document.getElementById('results').classList.add('show');
}

document.addEventListener('keypress', e => { if (e.key === 'Enter') calculate(); });
</script>
</body>
</html>
