<html lang="hi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gann Level Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"] {
    --bg: #0a0e1a;
    --card: #111827;
    --border: #1e293b;
    --gold: #f59e0b;
    --gold2: #fbbf24;
    --green: #10b981;
    --red: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
    --input-bg: #0d1220;
  }
  :root[data-theme="light"] {
    --bg: #f1f5f9;
    --card: #ffffff;
    --border: #cbd5e1;
    --gold: #d97706;
    --gold2: #f59e0b;
    --green: #059669;
    --red: #dc2626;
    --text: #1e293b;
    --muted: #64748b;
    --input-bg: #f8fafc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh; padding: 16px;
    transition: background 0.3s, color 0.3s;
  }
  .container { max-width: 720px; margin: 0 auto; }

  /* HEADER */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 0 14px;
    border-bottom: 1px solid var(--border); margin-bottom: 22px;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 3px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .subtitle { color: var(--muted); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

  .theme-btn {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 50px; padding: 8px 18px; cursor: pointer;
    font-family: 'Rajdhani', sans-serif; font-size: 0.85rem; font-weight: 700;
    color: var(--text); letter-spacing: 1px; transition: all 0.2s;
  }
  .theme-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* INPUT CARD */
  .input-section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px; margin-bottom: 18px;
  }

  .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }

  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  .input-group input, .input-group select {
    background: var(--input-bg); border: 1px solid var(--border); color: var(--text);
    padding: 11px 13px; border-radius: 8px; font-family: 'Rajdhani', sans-serif;
    font-size: 1rem; font-weight: 600; outline: none; transition: border-color 0.2s; width: 100%;
  }
  .input-group input:focus, .input-group select:focus { border-color: var(--gold); }
  .input-group select { cursor: pointer; }
  .input-group select option { background: var(--card); font-size: 0.9rem; }

  .hint { font-size: 0.68rem; color: var(--muted); }
  .hint span { color: var(--gold); font-weight: 700; }

  /* SEARCH BOX for stocks */
  .search-wrap { position: relative; }
  .search-wrap input { padding-left: 32px !important; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.85rem; pointer-events: none; }
  .dropdown-list {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    max-height: 200px; overflow-y: auto; z-index: 100; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .dropdown-list.open { display: block; }
  .dropdown-item {
    padding: 9px 13px; cursor: pointer; font-size: 0.88rem; font-weight: 600;
    border-bottom: 1px solid var(--border); transition: background 0.15s;
    display: flex; justify-content: space-between; align-items: center;
  }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover { background: var(--border); }
  .dropdown-item .sector { font-size: 0.65rem; color: var(--muted); font-weight: 400; }
  .selected-stock {
    background: var(--input-bg); border: 1px solid var(--gold);
    border-radius: 8px; padding: 11px 13px; font-family: 'Rajdhani', sans-serif;
    font-size: 1rem; font-weight: 700; color: var(--gold); display: none;
    cursor: pointer; width: 100%;
  }

  .calc-btn {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, var(--gold), #d97706);
    border: none; border-radius: 8px; color: #000;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 3px;
    cursor: pointer; transition: all 0.2s; margin-top: 4px;
  }
  .calc-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(245,158,11,0.3); }

  /* SHARE BUTTONS */
  .share-section { display: none; gap: 10px; margin-bottom: 18px; }
  .share-section.show { display: flex; animation: fadeUp 0.3s ease; }

  .share-btn {
    flex: 1; padding: 11px 14px; border: none; border-radius: 8px;
    cursor: pointer; font-family: 'Rajdhani', sans-serif; font-size: 0.9rem; font-weight: 700;
    letter-spacing: 1px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .whatsapp-btn { background: #25d366; color: #fff; }
  .whatsapp-btn:hover { background: #1ebe5d; transform: translateY(-1px); }
  .copy-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); }
  .copy-btn:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-1px); }
  .copy-btn.copied { border-color: var(--green) !important; color: var(--green) !important; }

  /* TRADE PLAN */
  .trade-plan { display: none; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  .trade-plan.show { display: block; animation: fadeUp 0.4s ease; }
  .plan-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; font-size: 1.05rem; color: var(--gold); margin-bottom: 12px; }
  .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .plan-card { border-radius: 10px; padding: 13px 14px; border: 1px solid; }
  .plan-card.bull { background: rgba(16,185,129,0.07); border-color: rgba(16,185,129,0.25); }
  .plan-card.bear { background: rgba(239,68,68,0.07); border-color: rgba(239,68,68,0.25); }
  .plan-card h3 { font-size: 0.78rem; letter-spacing: 2px; margin-bottom: 10px; }
  .plan-card.bull h3 { color: var(--green); }
  .plan-card.bear h3 { color: var(--red); }
  .plan-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.88rem; }
  .plan-row span:first-child { color: var(--muted); }
  .plan-row span:last-child { font-weight: 700; }
  .plan-card.bull .plan-row span:last-child { color: var(--green); }
  .plan-card.bear .plan-row span:last-child { color: var(--red); }

  /* RESULTS */
  .results { display: none; }
  .results.show { display: block; animation: fadeUp 0.4s ease; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .section-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; font-size: 0.95rem; margin-bottom: 9px; }
  .section-title.res { color: var(--red); }
  .section-title.sup { color: var(--green); }
  .section-title.base { color: var(--gold); }

  .levels-grid { display: grid; gap: 7px; margin-bottom: 14px; }

  .level-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 15px; display: flex; justify-content: space-between; align-items: center;
    transition: all 0.15s; position: relative; overflow: hidden;
  }
  .level-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .level-card.resistance::before { background: var(--red); }
  .level-card.support::before { background: var(--green); }
  .level-card.base::before { background: var(--gold); }
  .level-card:hover { border-color: var(--muted); transform: translateX(3px); }

  .level-left { display: flex; align-items: center; gap: 10px; }
  .level-badge { font-size: 0.7rem; font-weight: 700; padding: 3px 7px; border-radius: 5px; letter-spacing: 1px; min-width: 36px; text-align: center; }
  .resistance .level-badge { background: rgba(239,68,68,0.15); color: var(--red); }
  .support .level-badge { background: rgba(16,185,129,0.15); color: var(--green); }
  .base .level-badge { background: rgba(245,158,11,0.15); color: var(--gold); }

  .level-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.3; }
  .level-desc small { display: block; font-size: 0.63rem; color: var(--border); letter-spacing: 1px; }

  .level-right { display: flex; align-items: center; gap: 8px; }
  .level-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 1px; }
  .resistance .level-value { color: var(--red); }
  .support .level-value { color: var(--green); }
  .base .level-value { color: var(--gold); }

  .change-pct { font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; min-width: 50px; text-align: center; }
  .resistance .change-pct { background: rgba(239,68,68,0.1); color: var(--red); }
  .support .change-pct { background: rgba(16,185,129,0.1); color: var(--green); }
  .base .change-pct { background: rgba(245,158,11,0.1); color: var(--gold); }

  .note {
    background: rgba(245,158,11,0.05); border: 1px solid rgba(245,158,11,0.15);
    border-radius: 8px; padding: 12px 15px; font-size: 0.82rem;
    color: var(--muted); line-height: 1.7; margin-top: 4px;
  }
  .note strong { color: var(--gold); }

  /* SCROLLBAR */
  .dropdown-list::-webkit-scrollbar { width: 5px; }
  .dropdown-list::-webkit-scrollbar-track { background: var(--card); }
  .dropdown-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 500px) {
    .input-row { grid-template-columns: 1fr; }
    .plan-grid { grid-template-columns: 1fr; }
    .logo { font-size: 1.5rem; }
    .change-pct { display: none; }
  }
</style>

          <!-- Mode toggle -->
          <div style="display:flex;gap:6px;margin-bottom:8px">
            <button onclick="setMode('index')" id="btn-index" style="flex:1;padding:5px;border-radius:6px;border:1px solid var(--gold);background:var(--gold);color:#000;font-family:'Rajdhani',sans-serif;font-size:0.75rem;font-weight:700;cursor:pointer;letter-spacing:1px">INDICES</button>

          </div>

          <!-- Index select -->
          <select id="index-select">
            <option value="Nifty 50">Nifty 50</option>
            <option value="Bank Nifty">Bank Nifty</option>

            <option value="Finnifty">Finnifty</option>

          <!-- Stock search -->
          <div id="stock-search-wrap" style="display:none;position:relative">

              <input type="text" id="stock-search" placeholder="Search stock... e.g. RELIANCE" oninput="filterStocks()" onfocus="showDropdown()" autocomplete="off" />
            </div>
            <div class="dropdown-list" id="stock-dropdown"></div>
            <div id="selected-stock-display" class="selected-stock" onclick="clearStock()"></div>
          </div>
        </div>
      </div>

      <!-- YESTERDAY LOW -->
      <div class="input-group">
        <label>Yesterday Low</label>
        <input type="number" id="prev_low" placeholder="e.g. 25327.6" oninput="updateHint()" />
        <div class="hint">Rounded to nearest 10 → <span id="hint-low">—</span></div>
      </div>

    </div>
    <button class="calc-btn" onclick="calculate()">⚡ CALCULATE LEVELS</button>
  </div>

  <!-- SHARE BUTTONS -->
  <div class="share-section" id="share-section">
    <button class="share-btn whatsapp-btn" onclick="shareWhatsapp()">

      WhatsApp Share
    </button>
    <button class="share-btn copy-btn" onclick="copyLevels()" id="copy-btn">
      📋 Copy Levels
    </button>
  </div>

  <!-- TRADE PLAN -->
  <div class="trade-plan" id="trade-plan">
    <div class="plan-title">📋 INTRADAY TRADE PLAN</div>
    <div class="plan-grid" id="plan-grid"></div>
  </div>

  <!-- RESULTS -->
  <div class="results" id="results">
    <div class="section-title res">▲ RESISTANCE LEVELS</div>
    <div class="levels-grid" id="resistance-levels"></div>

    <div class="section-title base">● BASE PRICE</div>
    <div class="levels-grid" id="base-level"></div>

    <div class="section-title sup">▼ SUPPORT LEVELS</div>
    <div class="levels-grid" id="support-levels"></div>

    <div class="note" id="note-text"></div>
  </div>

</div>

// ── MODE TOGGLE ──────────────────────────────────────
let currentMode = 'index';
let selectedStock = null;

function setMode(mode) {
  currentMode = mode;
  const indexSel = document.getElementById('index-select');
  const stockWrap = document.getElementById('stock-search-wrap');
  const btnIdx = document.getElementById('btn-index');
  const btnStk = document.getElementById('btn-stock');

  if (mode === 'index') {
    indexSel.style.display = 'block';
    stockWrap.style.display = 'none';
    btnIdx.style.background = 'var(--gold)'; btnIdx.style.color = '#000'; btnIdx.style.borderColor = 'var(--gold)';
    btnStk.style.background = 'transparent'; btnStk.style.color = 'var(--muted)'; btnStk.style.borderColor = 'var(--border)';
  } else {
    indexSel.style.display = 'none';
    stockWrap.style.display = 'block';
    btnStk.style.background = 'var(--gold)'; btnStk.style.color = '#000'; btnStk.style.borderColor = 'var(--gold)';
    btnIdx.style.background = 'transparent'; btnIdx.style.color = 'var(--muted)'; btnIdx.style.borderColor = 'var(--border)';
    renderDropdown(STOCKS.slice(0,20));
  }
}

function filterStocks() {
  const q = document.getElementById('stock-search').value.toUpperCase();
  const filtered = q.length === 0 ? STOCKS.slice(0,20) : STOCKS.filter(s => s.s.includes(q) || s.n.toUpperCase().includes(q));
  renderDropdown(filtered.slice(0,30));
  document.getElementById('stock-dropdown').classList.add('open');
}

function renderDropdown(list) {
  const dd = document.getElementById('stock-dropdown');
  if (list.length === 0) {
    dd.innerHTML = `<div class="dropdown-item" style="color:var(--muted)">No results found</div>`;
  } else {
    dd.innerHTML = list.map(s =>
      `<div class="dropdown-item" onclick="selectStock('${s.s}','${s.n}')">
        <span>${s.s} <span style="color:var(--muted);font-weight:400;font-size:0.8rem">· ${s.n}</span></span>
        <span class="sector">${s.sec}</span>
      </div>`
    ).join('');
  }
}

function showDropdown() {
  filterStocks();
  document.getElementById('stock-dropdown').classList.add('open');
}

function selectStock(symbol, name) {
  selectedStock = { symbol, name };
  document.getElementById('stock-search').value = '';
  document.getElementById('stock-dropdown').classList.remove('open');
  const disp = document.getElementById('selected-stock-display');
  disp.textContent = `${symbol}  ✕`;
  disp.style.display = 'block';
  document.querySelector('.search-wrap').style.display = 'none';
}

function clearStock() {
  selectedStock = null;
  document.getElementById('selected-stock-display').style.display = 'none';
  document.querySelector('.search-wrap').style.display = 'block';
  document.getElementById('stock-search').value = '';
}

// Close dropdown on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('#stock-search-wrap')) {
    const dd = document.getElementById('stock-dropdown');
    if (dd) dd.classList.remove('open');
  }
});

// ── HINT ──────────────────────────────────────────────
function roundNearest10(n) { return Math.round(n / 10) * 10; }
function fmt(n) { return Number(n).toLocaleString('en-IN'); }

function updateHint() {
  const val = parseFloat(document.getElementById('prev_low').value);
  document.getElementById('hint-low').textContent = val > 0 ? fmt(roundNearest10(val)) : '—';
}

// ── GANN ──────────────────────────────────────────────
function calcLevels(base) {
  const s = Math.sqrt(base);
  return {
    R4: Math.round((s + 1.00) ** 2),
    R3: Math.round((s + 0.75) ** 2),
    R2: Math.round((s + 0.25) ** 2),
    R1: Math.round((s + 0.125) ** 2),
    BASE: base,
    S1: Math.round((s - 0.125) ** 2),
    S2: Math.round((s - 0.25) ** 2),
    S3: Math.round((s - 0.75) ** 2),
    S4: Math.round((s - 1.00) ** 2),
  };
}

function pct(a, b) {
  const d = ((a - b) / b * 100);
  return (d >= 0 ? '+' : '') + d.toFixed(2) + '%';
}

function card(type, badge, desc, sub, value, base) {
  return `<div class="level-card ${type}">
    <div class="level-left">
      <span class="level-badge">${badge}</span>
      <div class="level-desc">${desc}<small>${sub}</small></div>
    </div>
    <div class="level-right">
      <span class="change-pct">${pct(value, base)}</span>
      <span class="level-value">${fmt(value)}</span>
    </div>
  </div>`;
}

// ── SHARE ─────────────────────────────────────────────
let shareText = '';

function shareWhatsapp() {
  window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, '_blank');
}

function copyLevels() {
  navigator.clipboard.writeText(shareText).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy Levels'; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = shareText;
    document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✅ Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy Levels'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── CALCULATE ─────────────────────────────────────────
function calculate() {
  const rawLow = parseFloat(document.getElementById('prev_low').value);
  if (!rawLow || rawLow <= 0) { alert('Yesterday Low enter karein'); return; }

  let instrument;
  if (currentMode === 'index') {
    instrument = document.getElementById('index-select').value;
  } else {
    if (!selectedStock) { alert('Stock select karein'); return; }
    instrument = selectedStock.symbol + ' (' + selectedStock.name + ')';
  }

  const base = roundNearest10(rawLow);
  const L = calcLevels(base);

  document.getElementById('resistance-levels').innerHTML =
    card('resistance','R4','Strong Resistance','Book profit / Major target',L.R4,base) +
    card('resistance','R3','Resistance','Watch for reversal',L.R3,base) +
    card('resistance','R2','Resistance','Minor hurdle',L.R2,base) +
    card('resistance','R1','Nearest Resistance','First barrier ▲',L.R1,base);

  document.getElementById('base-level').innerHTML =
    card('base','BASE',`Yesterday Low: ${fmt(rawLow)}`,`Gann anchor → ${fmt(base)}`,base,base);

  document.getElementById('support-levels').innerHTML =
    card('support','S1','Nearest Support','First cushion ▼',L.S1,base) +
    card('support','S2','Support','Minor support',L.S2,base) +
    card('support','S3','Support','Watch for bounce',L.S3,base) +
    card('support','S4','Strong Support','Buy zone / Stop loss',L.S4,base);

  document.getElementById('plan-grid').innerHTML = `
    <div class="plan-card bull">
      <h3>✅ BULLISH SCENARIO</h3>
      <div class="plan-row"><span>Entry above</span><span>${fmt(L.R1)}</span></div>
      <div class="plan-row"><span>Target 1</span><span>${fmt(L.R2)}</span></div>
      <div class="plan-row"><span>Target 2</span><span>${fmt(L.R3)}</span></div>
      <div class="plan-row"><span>Target 3</span><span>${fmt(L.R4)}</span></div>
      <div class="plan-row"><span>Stop Loss</span><span>${fmt(L.S1)}</span></div>
    </div>
    <div class="plan-card bear">
      <h3>❌ BEARISH SCENARIO</h3>
      <div class="plan-row"><span>Entry below</span><span>${fmt(L.S1)}</span></div>
      <div class="plan-row"><span>Target 1</span><span>${fmt(L.S2)}</span></div>
      <div class="plan-row"><span>Target 2</span><span>${fmt(L.S3)}</span></div>
      <div class="plan-row"><span>Target 3</span><span>${fmt(L.S4)}</span></div>
      <div class="plan-row"><span>Stop Loss</span><span>${fmt(L.R1)}</span></div>
    </div>`;

  document.getElementById('note-text').innerHTML = `
    <strong>📌 ${instrument}</strong> &nbsp;|&nbsp;
    Yesterday Low: <strong>${fmt(rawLow)}</strong> → Base: <strong style="color:var(--gold)">${fmt(base)}</strong><br>
    <strong>Bullish:</strong> Above <strong style="color:var(--green)">${fmt(L.R1)}</strong> → Target ${fmt(L.R3)} → ${fmt(L.R4)}<br>
    <strong>Bearish:</strong> Below <strong style="color:var(--red)">${fmt(L.S1)}</strong> → Target ${fmt(L.S2)} → ${fmt(L.S3)}<br>
    <span style="font-size:0.7rem;opacity:0.4">Gann Square of 9 · Verified with @Gannhidden ✅</span>
  `;

  const date = new Date().toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'});
  shareText =
    `📊 *${instrument} — Gann Levels*\n📅 ${date}\n\n` +
    `*🔴 RESISTANCE*\nR4 → ${fmt(L.R4)}\nR3 → ${fmt(L.R3)}\nR2 → ${fmt(L.R2)}\nR1 → ${fmt(L.R1)}\n\n` +
    `*🟡 BASE: ${fmt(base)}*\n_(Yesterday Low: ${fmt(rawLow)})_\n\n` +
    `*🟢 SUPPORT*\nS1 → ${fmt(L.S1)}\nS2 → ${fmt(L.S2)}\nS3 → ${fmt(L.S3)}\nS4 → ${fmt(L.S4)}\n\n` +
    `*📋 Trade Plan*\n` +
    `✅ Bullish above ${fmt(L.R1)} → T1: ${fmt(L.R2)} | T2: ${fmt(L.R3)} | T3: ${fmt(L.R4)}\n` +
    `❌ Bearish below ${fmt(L.S1)} → T1: ${fmt(L.S2)} | T2: ${fmt(L.S3)} | T3: ${fmt(L.S4)}\n\n` +
    `_Gann Square of 9 · Verified Method_ ⚡`;

  document.getElementById('results').classList.add('show');
  document.getElementById('trade-plan').classList.add('show');
  document.getElementById('share-section').classList.add('show');

  // Scroll to results
  setTimeout(() => document.getElementById('share-section').scrollIntoView({behavior:'smooth'}), 100);
}

document.addEventListener('keypress', e => { if (e.key === 'Enter') calculate(); });
